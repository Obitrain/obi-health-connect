# Releases only when a release/<version> PR merges (open one with `yarn release <version>`): npm publish via
# trusted publishing (the npmjs.com trusted publisher must point at this file), tag v<version>, GitHub
# release with the PR description as notes. Dispatch re-runs a release (from its
# tag, or main if it failed before tagging); every step is idempotent.
name: Publish

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to (re-)publish, e.g. 0.4.0 — uses tag v<version> if it exists, else main
        required: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance, no token needed

    steps:
      - name: Resolve version
        id: v
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          PR_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          VERSION="${INPUT_VERSION:-${HEAD_REF#release/}}"
          VERSION="${VERSION#v}"
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "not a semver: '$VERSION'"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A release that failed before tagging is re-run from main; the package.json check still guards it
          REF="$PR_SHA"
          if [[ -n $INPUT_VERSION ]]; then
            REF=main
            if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY" "refs/tags/v$VERSION" >/dev/null; then
              REF="v$VERSION"
            fi
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.v.outputs.ref }}
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Point npm at the public registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: package.json must match the release version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: test "$(node -p "require('./package.json').version")" = "$VERSION"

      - name: Build
        run: |
          yarn nitrogen
          yarn prepare

      # npm stage publish (new-package support) needs a recent CLI
      - name: Update npm
        run: npm install -g npm@^11.21.1

      - name: Publish to npm
        env:
          PACKAGE: '@obitrain/react-native-health-connect'
          VERSION: ${{ steps.v.outputs.version }}
          # only used to create the package (granular token WITHOUT 2FA bypass); delete it afterwards
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}
        run: |
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$VERSION already on npm, skipping"
          elif npm view "$PACKAGE" name >/dev/null 2>&1; then
            npm publish --provenance
          else
            # trusted publishing can't create a package: stage it, a maintainer approves with 2FA
            npm stage publish --provenance --access public
            echo "::notice::Staged $PACKAGE@$VERSION. Approve it with 'npm stage approve <stage-id>' (npm stage list $PACKAGE), then add the trusted publisher and delete NPM_STAGE_TOKEN."
          fi

      - name: Tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          TAG="v$VERSION"
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || { git tag "$TAG" && git push origin "$TAG"; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          if [ -n "$PR_BODY" ]; then
            printf '%s\n' "$PR_BODY" > /tmp/notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
